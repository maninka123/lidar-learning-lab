<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>LiDAR Learning Lab</title>
    <script>
      // Show the dark splash at once (before the app's scripts arrive), but only when the intro itself will be shown: never seen, or last shown 2 hours or more ago.
      // Keep in step with src/intro/config.ts (storageKey, cooldown). This script only reads the time; the intro writes it.
      try { var l = Number(localStorage.getItem('lidar-lab-intro-last')), n = Date.now(); if (!(l > 0) || l > n || n - l >= 7200000) document.documentElement.classList.add('intro-pending'); } catch (e) { document.documentElement.classList.add('intro-pending'); }
    </script>
    <style>
      html.intro-pending body { background: #05080f; }
      #intro-boot { display: none; }
      html.intro-pending #intro-boot { position: fixed; inset: 0; z-index: 9998; display: grid; place-content: center; padding: 0 1.5rem 7vh; text-align: center; background: linear-gradient(180deg, #05080f, #0a1424); }
      html.intro-pending #intro-boot span { font: 700 clamp(2.3rem, 7.2vw, 4.6rem)/1.05 -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif; letter-spacing: -.035em; max-width: 14ch; color: #f2f6fb; }
    </style>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a84ff'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3Cpath d='M16 16 L27 8 M16 16 L28 16 M16 16 L27 24' stroke='white' stroke-width='1.6' opacity='.7'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="intro-boot" aria-hidden="true"><span>LiDAR Learning Lab</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
