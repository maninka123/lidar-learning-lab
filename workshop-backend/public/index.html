<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>LiDAR Lab workshop service</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:#f5f5f7; color:#1d1d1f; font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) { body { background:#111114; color:#f2f2f4; } }
  p { margin:0; opacity:.75; }
  main { text-align:center; display:grid; gap:10px; }
  a.quiet { color:inherit; opacity:.55; font-size:14px; text-decoration:none; border:1px solid currentColor; border-radius:999px; padding:3px 14px; justify-self:center; }
  a.quiet:hover, a.quiet:focus { opacity:1; }
</style>
</head>
<body>
<main>
<p>LiDAR Lab · workshop service is running.</p>
<a class="quiet" href="/admin">Admin</a>
</main>
</body>
</html>
